<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Agent Assistant · orchestration demo</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--line:#1f2a44;--text:#e5e9f2;--mute:#8a96b2;--accent:#5eead4}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;margin:0 12px 0 0;letter-spacing:.2px}h1 span{color:var(--accent)}
select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
button{cursor:pointer}button.primary{background:var(--accent);color:#04201c;border:0;font-weight:600}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
#request{margin:14px 20px 0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#request b{color:var(--accent)}
main{display:grid;grid-template-columns:250px 1fr 380px;gap:14px;padding:14px 20px;height:calc(100vh - 130px)}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;min-height:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:0 0 10px}
.agent{display:flex;gap:10px;align-items:flex-start;padding:9px;border-radius:9px;border:1px solid transparent;margin-bottom:6px;transition:.2s}
.agent.busy{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px;flex:none}
.agent.busy .dot{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}}
.agent .n{font-weight:600}.agent .r{font-size:12px;color:var(--mute)}.agent .s{font-size:11px;color:var(--c)}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.col{background:#0e1527;border-radius:9px;padding:8px;min-height:120px}
.col h3{font-size:11px;margin:0 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,#475569);border-radius:7px;padding:7px 8px;margin-bottom:6px;font-size:12.5px;animation:in .25s}
.card .a{font-size:11px;color:var(--mute)}.card.rejected,.card.cancelled{opacity:.55;text-decoration:line-through}
@keyframes in{from{transform:translateY(4px);opacity:0}}
#gate{display:none;margin-bottom:12px;padding:12px;border:1px solid #f59e0b;background:#2a1f08;border-radius:10px}
#gate.show{display:block}#gate pre{white-space:pre-wrap;font-size:12px;color:#fde68a;margin:8px 0}
#gate button{margin-right:6px}
#outputs{margin-top:12px}.out{font-size:12.5px;padding:8px;border-bottom:1px dashed var(--line)}.out b{color:var(--accent)}
.msg{padding:8px 9px;border-radius:8px;margin-bottom:6px;background:#0e1527;font-size:12.5px;animation:in .25s}
.msg .h{font-size:11px;color:var(--mute);margin-bottom:2px}.msg .h b{color:var(--c)}
.msg.approval{outline:1px solid #f59e0b}.msg.approve{outline:1px solid #22c55e}.msg.reject{outline:1px solid #ef4444}
.msg .k{float:right;font-size:10px;text-transform:uppercase;color:var(--mute)}
footer{position:fixed;bottom:6px;right:20px;font-size:11px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>Multi-Agent <span>Assistant</span></h1>
  <select id="scenario"></select>
  <select id="mode"></select>
  <button class="primary" id="run">▶ Run</button>
  <span class="pill" id="state">idle</span>
  <span class="pill" id="clock">t=0.0s</span>
</header>
<div id="request">Pick a scenario and press <b>Run</b>. Agents coordinate through the orchestrator; outbound actions wait for your approval.</div>
<main>
  <section><h2>Agents</h2><div id="roster"></div></section>
  <section>
    <h2>Task graph</h2>
    <div id="gate"><b>⏸ Human approval required</b><div id="gatetitle"></div><pre id="gatectx"></pre>
      <button class="primary" id="ok">Approve</button><button id="no">Reject</button></div>
    <div id="board"></div>
    <div id="outputs"></div>
  </section>
  <section><h2>Message bus</h2><div id="bus"></div></section>
</main>
<footer>All companies, people and data are fictional.</footer>
<script>
const COLS=[["blocked","Blocked"],["queued","Queued"],["running","Running"],["awaiting_approval","Awaiting approval"],["done","Done"]];
const $=s=>document.querySelector(s);let agents={},tasks={},colors={Human:"#e5e9f2",Orchestrator:"#5eead4"};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function init(){const r=await (await fetch("/api/scenarios")).json();
  for(const[k,v]of Object.entries(r.scenarios))$("#scenario").add(new Option(v.title,k));
  for(const[k,ok]of Object.entries(r.modes)){const o=new Option(k+(ok?"":" (unavailable)"),k);o.disabled=!ok;$("#mode").add(o)}
  const p=new URLSearchParams(location.search);if(p.get("scenario"))$("#scenario").value=p.get("scenario");
  connect();if(p.get("autorun"))run();}
function reset(){agents={};tasks={};$("#bus").innerHTML="";$("#outputs").innerHTML="";render()}
function run(){fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({scenario:$("#scenario").value,mode:$("#mode").value})});$("#run").textContent="↻ Replay"}
function decide(ok){const t=Object.values(tasks).find(t=>t.status==="awaiting_approval");if(!t)return;
  fetch("/api/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task_id:t.id,approved:ok,note:ok?"":"Not now."})})}
function connect(){const es=new EventSource("/api/events");es.addEventListener("reset",reset);es.onmessage=e=>handle(JSON.parse(e.data))}
function handle(ev){$("#clock").textContent="t="+ev.t.toFixed(1)+"s";
  if(ev.type==="agent"){agents[ev.agent.name]=ev.agent;colors[ev.agent.name]=ev.agent.color}
  if(ev.type==="task")tasks[ev.task.id]=ev.task;
  if(ev.type==="request")$("#request").innerHTML=`<b>Request</b> · ${esc(ev.title)} <span class="pill">${esc(ev.mode)}</span><br>${esc(ev.text)}`;
  if(ev.type==="run")$("#state").textContent=ev.state;
  if(ev.type==="message")addMsg(ev);
  render()}
function addMsg(m){const d=document.createElement("div");d.className="msg "+m.kind;d.style.setProperty("--c",colors[m.sender]||"#94a3b8");
  d.innerHTML=`<span class="k">${m.kind}</span><div class="h"><b>${esc(m.sender)}</b> → ${esc(m.to)} · ${m.t.toFixed(1)}s</div>${esc(m.content).replace(/\n/g,"<br>")}`;
  $("#bus").prepend(d)}
function render(){
  $("#roster").innerHTML=Object.values(agents).map(a=>`<div class="agent ${a.status}" style="--c:${a.color}"><div class="dot"></div><div><div class="n">${a.name}</div><div class="r">${esc(a.role)}</div><div class="s">${a.status}${a.busy_with?" · "+a.busy_with:""}</div></div></div>`).join("");
  $("#board").innerHTML=COLS.map(([k,l])=>`<div class="col"><h3>${l}</h3>${Object.values(tasks).filter(t=>t.status===k||(k==="done"&&["rejected","cancelled"].includes(t.status))||(k==="queued"&&t.status==="dispatching")).map(t=>`<div class="card ${t.status}" style="--c:${colors[t.agent]||colors[agentFor(t)]||"#475569"}">${esc(t.title)}<div class="a">${t.agent||agentFor(t)||""}${t.deps.length?" · after "+t.deps.join(", "):""}${t.requires_approval?" · 🔒 gate":""}</div></div>`).join("")}</div>`).join("");
  const g=Object.values(tasks).find(t=>t.status==="awaiting_approval");$("#gate").classList.toggle("show",!!g);
  if(g){$("#gatetitle").textContent=g.title;$("#gatectx").textContent=g.deps.map(d=>tasks[d]&&tasks[d].output).join("\n")}
  $("#outputs").innerHTML=Object.values(tasks).filter(t=>t.status==="done"&&t.skill==="summarize").map(t=>`<div class="out"><b>Final brief</b><br>${esc(t.output)}</div>`).join("")}
const SKILL={plan:"Planner",summarize:"Planner",research:"Researcher",schedule:"Scheduler",draft:"Scribe",review:"Guardian",send:"Dispatcher"};
const agentFor=t=>SKILL[t.skill];
$("#run").onclick=run;$("#ok").onclick=()=>decide(true);$("#no").onclick=()=>decide(false);init();
</script>
</body></html>
